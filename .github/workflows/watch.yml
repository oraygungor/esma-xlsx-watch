name: Watch ESMA XLSX

on:
  schedule:
    - cron: "0 */6 * * *"   # 6 saatte bir (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip requests

      - name: Run watcher (TEST_MODE enabled)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          TEST_MODE: "false"
        run: python watch_esma.py

      - name: Debug
        run: ls -la

      - name: Commit & push last_hash.txt if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A last_hash.txt || true

          if [ -z "$(git status --porcelain)" ]; then
            echo "No repo changes to commit."
            exit 0
          fi

          git commit -m "Update last_hash"
          git push
