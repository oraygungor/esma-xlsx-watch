name: Watch ESMA XLSX

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip requests

      - name: Run watcher
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python watch_esma.py

      - name: Debug (optional)
        run: ls -la

      - name: Git config
        run: bash -lc 'git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com"'

      - name: Stage hash file
        run: bash -lc 'git add -A last_hash.txt || true'

      - name: Commit & push if changed
        run: bash -lc 'if git status --porcelain | grep -q .; then git commit -m "Update last_hash" && git push; else echo "No repo changes to commit."; fi'
